name: Radio Schipluiden ON AIR - herstelde APK
on:
  push:
    branches: [radio-schipluiden-android-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore bundled banner and jingle
        run: |
          python3 - <<'PY'
          import pathlib,base64
          for p in pathlib.Path('bundle').glob('*.b64'):
              output=pathlib.Path(p.name[:-4].replace('__','/'))
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(base64.b64decode(p.read_text()))
              print(output,output.stat().st_size)
          PY
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify APK archive
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          if [ -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -8
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Schipluiden-ON-AIR-Hersteld
          path: app/build/outputs/apk/debug/app-debug.apk
  emulator-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore bundled images and MP3
        run: |
          python3 - <<'PY'
          import pathlib,base64
          for p in pathlib.Path('bundle').glob('*.b64'):
              output=pathlib.Path(p.name[:-4].replace('__','/'))
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(base64.b64decode(p.read_text()))
          PY
      - name: Open app in Android emulator and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle assembleDebug --quiet
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n nl.radioschipluiden.radio/nl.radioschipluiden.app.MainActivity
            sleep 12
            adb shell pidof nl.radioschipluiden.radio
            adb shell am start-foreground-service -n nl.radioschipluiden.radio/nl.radioschipluiden.app.RadioService -a nl.radioschipluiden.app.PLAY
            sleep 4
            if adb logcat -d -v brief | grep -E "FATAL EXCEPTION|Process: nl.radioschipluiden.radio.*has died"; then exit 1; fi
            echo "Android activity and service started without a fatal Java exception."
