name: Radio Schipluiden ON AIR Android APK
on:
  push:
    branches: [radio-schipluiden-android-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore bundled original banner and jingle
        run: |
          python3 - <<'PY'
          import pathlib,base64
          for p in pathlib.Path('bundle').glob('*.b64'):
              output=pathlib.Path(p.name[:-4].replace('__','/'))
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(base64.b64decode(p.read_text()))
              print(output, output.stat().st_size)
          PY
      - name: Build Android APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Radio-Schipluiden-ON-AIR-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
