name: Bouw Radio Schipluiden Android Auto
on:
  push:
    branches:
      - build/radioschipluiden-android-auto-20261017
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Maak projectbestanden
        run: |
          base64 --decode radio-build/radio-sources.tar.xz.b64 | xz -dc | tar -xf -
          base64 --decode radio-build/metadata-java.tar.xz.b64 | tar -xJf -
          base64 --decode radio-build/reconnect-service.tar.xz.b64 | tar -xJf -
          python3 - <<'PYFIX'
          from pathlib import Path
          manifest=Path('app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          s=s.replace('<uses-permission android:name="android.permission.WAKE_LOCK" />',
             '<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />')
          assert 'ACCESS_WIFI_STATE' in s and 'ACCESS_NETWORK_STATE' in s
          manifest.write_text(s)
          activity=Path('app/src/main/java/nl/radioschipluiden/app/MainActivity.java')
          s=activity.read_text()
          if '@Override public void onBackPressed()' not in s:
              s=s.replace('    @Override protected void onDestroy() {','    @Override public void onBackPressed() {\n        startCommand(RadioService.ACTION_STOP);\n        super.onBackPressed();\n    }\n    @Override protected void onDestroy() {')
          assert '@Override public void onBackPressed()' in s
          activity.write_text(s)
          build=Path('app/build.gradle')
          s=build.read_text().replace('versionCode 5','versionCode 6').replace("versionName '2.0'", "versionName '2.4'")
          build.write_text(s)
          PYFIX
          mkdir -p app/src/main/res/mipmap-nodpi app/src/main/assets
          python3 - <<'PY'
          import base64
          from pathlib import Path
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL7zAAAAABJRU5ErkJggg=='
          Path('app/src/main/res/mipmap-nodpi/ic_launcher.png').write_bytes(base64.b64decode(png))
          Path('app/src/main/assets/player.html').write_text('<html><head><style></style></head><body><h1>Radio Schipluiden</h1></body></html>',encoding='utf-8')
          PY
      - name: Android autoradio optimalisatie
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          patch = zlib.decompress(base64.b64decode(Path("radio-build/car-patch.zlib.b64").read_text())).decode("utf-8")
          exec(compile(patch, "car_patch.py", "exec"))
          PY
      - name: Android Auto media browser installeren
        run: |
          mkdir -p app/src/main/res/xml
          cp radio-build/AutoMediaService.java app/src/main/java/nl/radioschipluiden/app/AutoMediaService.java
          cat > app/src/main/res/xml/automotive_app_desc.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp xmlns:android="http://schemas.android.com/apk/res/android">
            <uses name="media" />
          </automotiveApp>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          addition = """
              <meta-data android:name="com.google.android.gms.car.application"
                         android:resource="@xml/automotive_app_desc" />
              <service android:name=".AutoMediaService" android:exported="true">
                <intent-filter>
                  <action android:name="android.media.browse.MediaBrowserService" />
                </intent-filter>
              </service>
          """
          assert '</application>' in s
          s = s.replace('</application>', addition + '</application>')
          manifest.write_text(s)
          build = Path('app/build.gradle')
          sb = build.read_text()
          sb = re.sub(r'versionCode\\s+\\d+', 'versionCode 9', sb)
          sb = re.sub(r'versionName\\s+\\x27[^\\x27]*\\x27', "versionName '2.6-AndroidAuto'", sb)
          build.write_text(sb)
          assert 'AutoMediaService' in manifest.read_text()
          PY
      - name: Bouw echte Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RadioSchipluiden-AndroidAuto-gecompileerd
          path: app/build/outputs/apk/debug/app-debug.apk
