name: Bouw Radio Schipluiden schermvullend 3.3
on:
  push:
    branches:
      - build/radioschipluiden-fit-all-screens-20261018
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Maak projectbestanden
        run: |
          base64 --decode radio-build/radio-sources.tar.xz.b64 | xz -dc | tar -xf -
          base64 --decode radio-build/metadata-java.tar.xz.b64 | tar -xJf -
          base64 --decode radio-build/reconnect-service.tar.xz.b64 | tar -xJf -
          python3 - <<'PYFIX'
          from pathlib import Path
          manifest=Path('app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          s=s.replace('<uses-permission android:name="android.permission.WAKE_LOCK" />',
             '<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />')
          assert 'ACCESS_WIFI_STATE' in s and 'ACCESS_NETWORK_STATE' in s
          manifest.write_text(s)
          activity=Path('app/src/main/java/nl/radioschipluiden/app/MainActivity.java')
          s=activity.read_text()
          if '@Override public void onBackPressed()' not in s:
              s=s.replace('    @Override protected void onDestroy() {','    @Override public void onBackPressed() {\n        startCommand(RadioService.ACTION_STOP);\n        super.onBackPressed();\n    }\n    @Override protected void onDestroy() {')
          assert '@Override public void onBackPressed()' in s
          activity.write_text(s)
          build=Path('app/build.gradle')
          s=build.read_text().replace('versionCode 5','versionCode 6').replace("versionName '2.0'", "versionName '2.4'")
          build.write_text(s)
          PYFIX
          mkdir -p app/src/main/res/mipmap-nodpi app/src/main/assets
          python3 - <<'PY'
          import base64
          from pathlib import Path
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL7zAAAAABJRU5ErkJggg=='
          Path('app/src/main/res/mipmap-nodpi/ic_launcher.png').write_bytes(base64.b64decode(png))
          Path('app/src/main/assets/player.html').write_text('<html><head><style></style></head><body><h1>Radio Schipluiden</h1></body></html>',encoding='utf-8')
          PY
      - name: Android autoradio optimalisatie
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          patch = zlib.decompress(base64.b64decode(Path("radio-build/car-patch.zlib.b64").read_text())).decode("utf-8")
          exec(compile(patch, "car_patch.py", "exec"))
          PY
      - name: Android Auto media browser installeren
        run: |
          mkdir -p app/src/main/res/xml
          cp radio-build/AutoMediaService.java app/src/main/java/nl/radioschipluiden/app/AutoMediaService.java
          cat > app/src/main/res/xml/automotive_app_desc.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp xmlns:android="http://schemas.android.com/apk/res/android">
            <uses name="media" />
          </automotiveApp>
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          addition = """
              <meta-data android:name="com.google.android.gms.car.application"
                         android:resource="@xml/automotive_app_desc" />
              <service android:name=".AutoMediaService" android:exported="true">
                <intent-filter>
                  <action android:name="android.media.browse.MediaBrowserService" />
                </intent-filter>
              </service>
          """
          assert '</application>' in s
          s = s.replace('</application>', addition + '</application>')
          manifest.write_text(s)
          build = Path('app/build.gradle')
          sb = build.read_text()
          sb = re.sub(r'versionCode\\s+\\d+', 'versionCode 9', sb)
          sb = re.sub(r'versionName\\s+\\x27[^\\x27]*\\x27', "versionName '2.6-AndroidAuto'", sb)
          build.write_text(sb)
          assert 'AutoMediaService' in manifest.read_text()
          PY
      - name: Los geluid zonder andere zender op
        run: |
          python3 radio-build/audiofocus-fix.py
          python3 - <<'PY'
          from pathlib import Path
          build=Path('app/build.gradle')
          lines=build.read_text().splitlines()
          lines=["        versionCode 10" if line.strip().startswith("versionCode ")
                 else "        versionName '2.7-AndroidAuto'" if line.strip().startswith("versionName ")
                 else line for line in lines]
          s=chr(10).join(lines)+chr(10)
          assert "versionCode 10" in s and "versionName '2.7-AndroidAuto'" in s
          build.write_text(s)
          assert 'requestAudioFocus()' in Path('app/src/main/java/nl/radioschipluiden/app/RadioService.java').read_text()
          PY
      - name: Google Cast koppeling toevoegen
        run: |
          cp radio-build/SchipluidenCastOptions.java app/src/main/java/nl/radioschipluiden/app/
          cp radio-build/SchipluidenCastController.java app/src/main/java/nl/radioschipluiden/app/
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          castmeta='<meta-data android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" android:value="nl.radioschipluiden.app.SchipluidenCastOptions" />'
          assert '</application>' in s
          s=s.replace('</application>',castmeta+'\n</application>')
          manifest.write_text(s)
          build=Path('app/build.gradle')
          t=build.read_text()
          t+='\ndependencies {\n  implementation "com.google.android.gms:play-services-cast-framework:22.3.1"\n}\n'
          lines=t.splitlines()
          lines=[("        versionCode 11" if line.strip().startswith('versionCode ')
                  else "        versionName '2.8-GoogleCast'" if line.strip().startswith('versionName ')
                  else line) for line in lines]
          build.write_text(chr(10).join(lines)+chr(10))
          props=Path('gradle.properties')
          props.write_text(props.read_text()+'\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n')
          java=Path('app/src/main/java/nl/radioschipluiden/app/MainActivity.java')
          t=java.read_text()
          t=t.replace('import android.webkit.WebView;', 'import android.webkit.WebView;\nimport android.widget.FrameLayout;')
          t=t.replace('    private WebView webView;', '    private WebView webView;\n    private SchipluidenCastController castController;')
          t=t.replace('        setContentView(webView);', '        FrameLayout root = new FrameLayout(this);\n        root.addView(webView,new FrameLayout.LayoutParams(-1,-1));\n        castController = new SchipluidenCastController(this,root);\n        setContentView(root);')
          t=t.replace('            startCommand(RadioService.ACTION_PLAY);','            if(castController!=null && castController.isCasting()){\n                castController.startOrResume();\n                updatePage("playing","Live via Google Home of Chromecast");\n            } else startCommand(RadioService.ACTION_PLAY);')
          t=t.replace('    @JavascriptInterface public void stop() { runOnUiThread(() -> startCommand(RadioService.ACTION_STOP)); }',
              '    @JavascriptInterface public void stop() { runOnUiThread(() -> {\n            if(castController!=null && castController.isCasting())castController.stopRemote();\n            startCommand(RadioService.ACTION_STOP);\n        }); }')
          t=t.replace('        super.onStart();','        super.onStart();\n        if(castController!=null)castController.onStart();')
          t=t.replace('        active=false; handler.removeCallbacks(poll);','        active=false; handler.removeCallbacks(poll);\n        if(castController!=null)castController.onStop();')
          assert 'new SchipluidenCastController(this,root)' in t
          java.write_text(t)
          PY
      - name: Verhelp app crash bij Cast opstart
        run: python3 radio-build/cast-startup-fix.py
      - name: Plaats Cast in speler en voeg updatecontrole toe
        run: python3 radio-build/cast-update-v3-patch.py
      - name: Zet nieuw Android-versienummer 3.3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          lines=p.read_text().splitlines()
          lines=['        versionCode 15' if x.strip().startswith('versionCode ')
                 else "        versionName '3.3'" if x.strip().startswith('versionName ')
                 else x for x in lines]
          p.write_text(chr(10).join(lines)+chr(10))
          assert 'versionCode 15' in p.read_text()
          PY
      - name: Bouw echte Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RadioSchipluiden-3-3-gecompileerd
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Bewaar officiële Android tekengereedschappen
        if: success()
        run: |
          find "$ANDROID_HOME/build-tools" -name apksigner.jar -o -name zipalign | sort
          mkdir -p android-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-tools/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-tools-apk-35
          path: android-tools/
