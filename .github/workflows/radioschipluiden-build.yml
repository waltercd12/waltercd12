name: Bouw Radio Schipluiden Android
on:
  push:
    branches:
      - build/radioschipluiden-android-20261017
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Maak projectbestanden
        run: |
          base64 --decode radio-build/radio-sources.tar.xz.b64 | xz -dc | tar -xf -
          base64 --decode radio-build/metadata-java.tar.xz.b64 | tar -xJf -
          mkdir -p app/src/main/res/mipmap-nodpi app/src/main/assets
          python3 - <<'PY'
          import base64
          from pathlib import Path
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL7zAAAAABJRU5ErkJggg=='
          Path('app/src/main/res/mipmap-nodpi/ic_launcher.png').write_bytes(base64.b64decode(png))
          Path('app/src/main/assets/player.html').write_text('<html><body><h1>Radio Schipluiden</h1></body></html>',encoding='utf-8')
          PY
      - name: Bouw echte Android APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RadioSchipluiden-gecompileerd
          path: app/build/outputs/apk/debug/app-debug.apk
