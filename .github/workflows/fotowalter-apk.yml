name: Bouw FotoWalter Android APK
on:
  push:
    branches:
      - fotowalter-android-app-build
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: FotoWalterAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK installeren
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: FotoWalter-logo klaarzetten
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app/brand.jpg.base64 > app/src/main/res/drawable/brand.jpg
          file app/src/main/res/drawable/brand.jpg
      - name: Android-app compileren
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: FotoWalter-Android-APK
          path: FotoWalterAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
