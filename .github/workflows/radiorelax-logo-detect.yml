name: Detect Radio Relax FM partner logo
on:
  push:
    branches: [build/radioschipluiden-redesign-20261018]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official logo candidates
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          from html.parser import HTMLParser
          url='https://radiorelaxfm.nl/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=20) as r: data=r.read().decode('utf-8','replace')
          print('FETCH OK',len(data),data[:200])
          matches=re.findall(r'<(?:img|meta|link)[^>]+>',data,re.I)
          for tag in matches[:150]:
              if any(k in tag.lower() for k in ['logo','icon','og:image','header','branding','radio']):
                  print('CANDIDATE',tag[:1000])
          from pathlib import Path
          Path('official-radio-relax-site.html').write_text(data)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: official-radiorelax-site-html
          path: official-radio-relax-site.html
