name: Build FotoWalter P2000 Haaglanden APK
on:
  push:
    branches: [fotowalter-android-whatsapp-v4]
    paths:
      - '.github/workflows/fotowalter-p2000-apk.yml'
      - 'fotowalter-p2000/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed debug APK
        working-directory: fotowalter-p2000
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK
        run: |
          APK="fotowalter-p2000/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -12
          mkdir -p release
          cp "$APK" release/FotoWalter-P2000-Haaglanden-WhatsApp-V4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FotoWalter-P2000-Haaglanden-WhatsApp-V4
          path: release/FotoWalter-P2000-Haaglanden-WhatsApp-V4.apk
      - name: Publish APK to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/FotoWalter-P2000-Haaglanden-WhatsApp-V4.apk
          git commit -m "Build FotoWalter P2000 WhatsApp Android APK" || true
          git push origin HEAD:fotowalter-android-whatsapp-v4
